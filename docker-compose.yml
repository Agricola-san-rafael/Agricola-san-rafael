services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agricola
      POSTGRES_PASSWORD: agricola_dev_password
      POSTGRES_DB: agricola_san_rafael
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricola"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
